services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
      - huggingface_cache:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface

    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  huggingface_cache: